<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лиды — Ладога</title>
<style>
  :root{
    --bg:#f7f6f3;
    --panel:#ffffff;
    --line:#e5e2db;
    --ink:#1c1b19;
    --sub:#8a8578;
    --accent:#3f6b52;
    --accent-bg:#e9efe9;
    --red:#a4463a;
    --red-bg:#f5e9e6;
    --amber:#8a6a2f;
    --amber-bg:#f4eddc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px 20px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .count{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;
    color:var(--sub);
    letter-spacing:0.4px;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  input[type=text], select{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
    color:var(--ink);
    outline:none;
  }
  input[type=text]{flex:1;min-width:180px;}
  input[type=text]:focus, select:focus{border-color:var(--accent);}
  select{cursor:pointer;}

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--sub);
    font-weight:600;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#faf9f6;}
  td{
    padding:10px 14px;
    font-size:13.5px;
    vertical-align:top;
  }
  td.name{font-weight:600;white-space:nowrap;}
  td.phone{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    color:var(--sub);
    white-space:nowrap;
  }
  td.note{color:#4a473f;}
  td.src{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11.5px;
    color:var(--sub);
    white-space:nowrap;
  }
  .tag{
    display:inline-block;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .tag-refuse{background:var(--red-bg);color:var(--red);}
  .tag-progress{background:var(--amber-bg);color:var(--amber);}
  .tag-paid{background:var(--accent-bg);color:var(--accent);}
  .tag-none{background:#eee;color:#777;}

  .empty{
    text-align:center;
    color:var(--sub);
    padding:40px;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
  }
  @media (max-width:640px){
    td.src{display:none;}
    thead th:nth-child(5){display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Лиды — Ладога</h1>
    <div class="count" id="count"></div>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Поиск по имени, телефону, заметке…">
    <select id="statusFilter">
      <option value="">Все статусы</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Статус</th>
        <th>Заметка</th>
        <th>Источник</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">Ничего не найдено</div>
</div>

const statusClass = s => {
  if(s==="Отказ") return "tag-refuse";
  if(s==="Оплатил") return "tag-paid";
  if(["В работе","Потенциал","Волонтёр","Уточнить"].includes(s)) return "tag-progress";
  return "tag-none";
};

const rowsEl = document.getElementById('rows');
const searchEl = document.getElementById('search');
const statusEl = document.getElementById('statusFilter');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

[...new Set(leads.map(l=>l[2]))].sort().forEach(s=>{
  const o=document.createElement('option');
  o.value=s; o.textContent=s;
  statusEl.appendChild(o);
});

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const st = statusEl.value;
  const filtered = leads.filter(l=>{
    const matchesQ = !q || l.join(' ').toLowerCase().includes(q);
    const matchesS = !st || l[2]===st;
    return matchesQ && matchesS;
  });
  rowsEl.innerHTML = filtered.map(l=>`
    <tr>
      <td class="name">${l[0]}</td>
      <td class="phone">${l[1]}</td>
      <td><span class="tag ${statusClass(l[2])}">${l[2]}</span></td>
      <td class="note">${l[3]}</td>
      <td class="src">${l[4]}</td>
    </tr>`).join('');
  emptyEl.style.display = filtered.length ? 'none' : 'block';
  countEl.textContent = `${filtered.length} из ${leads.length}`;
}

searchEl.addEventListener('input', render);
statusEl.addEventListener('change', render);
render();

</html>
