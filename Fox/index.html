<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUNNY FOX — ДА</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --o: #D85A30;
    --dark: #0f0f0f;
    --cream: #F5F0E8;
    --acid: #C8FF00;
    --pink: #FF3CAC;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Courier Prime', monospace;
    overflow-x: hidden;
    cursor: none;
  }

  /* CURSOR */
  .cursor {
    width: 18px; height: 18px;
    background: var(--o);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none;
