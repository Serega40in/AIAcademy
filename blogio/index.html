<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogio — Пиши. Делись. Читай.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:    #1B2A4A;
      --ink2:   #2D4A8A;
      --muted:  #6B7E9F;
      --border: #E2E8F0;
      --bg:     #FFFFFF;
      --card:   #F8FAFD;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--ink); font-family:'Mulish',sans-serif; }

    /* NAV */
    nav {
      position:sticky; top:0; z-index:100;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:0 24px;
      display:flex; align-items:center; justify-content:space-between;
      height:60px;
    }
    .logo {
      font-family:'Playfair Display',serif;
      font-size:1.5rem; font-weight:700;
      color:var(--ink); text-decoration:none;
      letter-spacing:-0.5px;
    }
    .logo span { color:var(--ink2); }
    .nav-actions { display:flex; gap:12px; align-items:center; }
    .btn {
      padding:8px 20px; border-radius:6px; font-family:'Mulish',sans-serif;
      font-size:0.875rem; font-weight:600; cursor:pointer; transition:all .2s;
      text-decoration:none; display:inline-block;
    }
    .btn-outline {
      border:1.5px solid var(--ink2); color:var(--ink2); background:transparent;
    }
    .btn-outline:hover { background:var(--ink2); color:#fff; }
    .btn-solid {
      background:var(--ink); color:#fff; border:1.5px solid var(--ink);
    }
    .btn-solid:hover { background:var(--ink2); border-color:var(--ink2); }

    /* HERO */
    .hero {
      text-align:center; padding:72px 24px 48px;
      border-bottom:1px solid var(--border);
    }
    .hero h1 {
      font-family:'Playfair Display',serif;
      font-size:clamp(2.2rem,5vw,3.5rem);
      color:var(--ink); line-height:1.15; margin-bottom:16px;
    }
    .hero p {
      color:var(--muted); font-size:1.1rem; font-weight:300;
      max-width:480px; margin:0 auto 32px;
    }

    /* FEED */
    .feed-wrap { max-width:720px; margin:0 auto; padding:40px 24px 80px; }
    .feed-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:32px;
    }
    .feed-header h2 {
      font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--ink);
    }

    .post-card {
      border:1px solid var(--border); border-radius:12px;
      padding:28px; margin-bottom:20px; background:var(--bg);
      transition:box-shadow .2s, transform .2s;
      text-decoration:none; display:block; color:inherit;
    }
    .post-card:hover {
      box-shadow:0 8px 32px rgba(27,42,74,0.10);
      transform:translateY(-2px);
    }
    .post-meta {
      display:flex; align-items:center; gap:10px;
      margin-bottom:14px;
    }
    .avatar {
      width:34px; height:34px; border-radius:50%;
      background:var(--ink2); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:0.8rem; font-weight:700; flex-shrink:0;
    }
    .author { font-weight:600; font-size:0.9rem; color:var(--ink); }
    .date { font-size:0.8rem; color:var(--muted); margin-left:auto; }
    .post-title {
      font-family:'Playfair Display',serif;
      font-size:1.25rem; font-weight:700;
      color:var(--ink); margin-bottom:10px; line-height:1.3;
    }
    .post-excerpt {
      color:var(--muted); font-size:0.9rem; line-height:1.6;
      display:-webkit-box; -webkit-line-clamp:3;
      -webkit-box-orient:vertical; overflow:hidden;
    }
    .post-img {
      width:100%; border-radius:8px; margin-top:16px;
      max-height:220px; object-fit:cover;
    }
    .post-footer {
      margin-top:16px; padding-top:14px;
      border-top:1px solid var(--border);
      display:flex; align-items:center; gap:16px;
    }
    .tag {
      background:var(--card); border:1px solid var(--border);
      color:var(--ink2); font-size:0.75rem; font-weight:600;
      padding:3px 10px; border-radius:20px;
    }
    .read-link { margin-left:auto; color:var(--ink2); font-size:0.85rem; font-weight:600; }

    /* EMPTY STATE */
    .empty {
      text-align:center; padding:80px 20px; color:var(--muted);
    }
    .empty-icon { font-size:3rem; margin-bottom:16px; }
    .empty h3 { font-family:'Playfair Display',serif; color:var(--ink); margin-bottom:8px; }

    /* AUTH MODAL */
    .overlay {
      display:none; position:fixed; inset:0;
      background:rgba(27,42,74,0.45); z-index:200;
      align-items:center; justify-content:center;
    }
    .overlay.active { display:flex; }
    .modal {
      background:#fff; border-radius:16px; padding:40px;
      width:100%; max-width:420px; margin:16px;
      box-shadow:0 24px 80px rgba(27,42,74,0.2);
    }
    .modal h2 {
      font-family:'Playfair Display',serif; font-size:1.6rem;
      color:var(--ink); margin-bottom:6px;
    }
    .modal p { color:var(--muted); font-size:0.9rem; margin-bottom:28px; }
    .tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:2px solid var(--border); }
    .tab {
      flex:1; padding:10px; text-align:center; cursor:pointer;
      font-weight:600; font-size:0.9rem; color:var(--muted);
      border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s;
    }
    .tab.active { color:var(--ink2); border-bottom-color:var(--ink2); }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:0.8rem; font-weight:600; color:var(--ink); margin-bottom:6px; }
    .field input {
      width:100%; padding:11px 14px; border:1.5px solid var(--border);
      border-radius:8px; font-family:'Mulish',sans-serif; font-size:0.95rem;
      color:var(--ink); outline:none; transition:border-color .2s;
    }
    .field input:focus { border-color:var(--ink2); }
    .btn-full { width:100%; padding:13px; font-size:1rem; border-radius:8px; margin-top:4px; }
    .close-btn {
      position:absolute; top:16px; right:20px; font-size:1.5rem;
      cursor:pointer; color:var(--muted); background:none; border:none;
      line-height:1;
    }
    .modal-wrap { position:relative; }
    .msg { font-size:0.85rem; margin-top:12px; text-align:center; padding:10px; border-radius:6px; }
    .msg.error { background:#FEF2F2; color:#DC2626; }
    .msg.success { background:#F0FDF4; color:#16A34A; }

    /* USER PILL */
    .user-pill {
      display:flex; align-items:center; gap:8px;
      font-size:0.875rem; font-weight:600; color:var(--ink);
    }
    .user-pill .avatar-sm {
      width:30px; height:30px; border-radius:50%;
      background:var(--ink); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:0.75rem; font-weight:700;
    }
    .btn-sm { padding:6px 14px; font-size:0.8rem; }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">Blog<span>io</span></a>
  <div class="nav-actions" id="navActions">
    <button class="btn btn-outline" onclick="openModal('login')">Войти</button>
    <a class="btn btn-solid" onclick="openModal('register')">Зарегистрироваться</a>
  </div>
</nav>

<section class="hero" id="heroSection">
  <h1>Пиши. Делись. Читай.</h1>
  <p>Создай свою страницу за минуту — с помощью ИИ или самостоятельно.</p>
  <a class="btn btn-solid" style="padding:13px 32px;font-size:1rem;" onclick="openModal('register')">Начать бесплатно →</a>
</section>

<div class="feed-wrap">
  <div class="feed-header">
    <h2>Последние публикации</h2>
    <a href="create.html" class="btn btn-outline btn-sm" id="writeBtn" style="display:none">✍️ Написать</a>
  </div>
  <div id="feed">
    <div class="empty">
      <div class="empty-icon">✍️</div>
      <h3>Пока пусто</h3>
      <p>Будь первым — создай публикацию!</p>
    </div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="overlay" id="authOverlay" onclick="closeModal(event)">
  <div class="modal modal-wrap">
    <button class="close-btn" onclick="document.getElementById('authOverlay').classList.remove('active')">×</button>
    <h2 id="modalTitle">Добро пожаловать</h2>
    <p id="modalSub">Войди или создай аккаунт</p>
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Войти</div>
      <div class="tab" id="tabRegister" onclick="switchTab('register')">Регистрация</div>
    </div>
    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
      <div class="field"><label>Пароль</label><input type="password" id="loginPass" placeholder="••••••••"></div>
      <button class="btn btn-solid btn-full" onclick="doLogin()">Войти</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="field"><label>Имя</label><input type="text" id="regName" placeholder="Твоё имя"></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
      <div class="field"><label>Пароль</label><input type="password" id="regPass" placeholder="Минимум 6 символов"></div>
      <button class="btn btn-solid btn-full" onclick="doRegister()">Создать аккаунт</button>
    </div>
    <div id="authMsg"></div>
  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
